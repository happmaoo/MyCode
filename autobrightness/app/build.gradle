apply plugin: 'com.android.application'

android {
    namespace 'com.myapp.autobrightness'
    compileSdk 34

    defaultConfig {
        applicationId "com.myapp.autobrightness"
        minSdkVersion 25
        targetSdkVersion 29
        versionCode 1

        def currentTime = new Date().format("yyyyMMdd.HHmm", TimeZone.getTimeZone("GMT+8"))
        versionName "2.1.${currentTime}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 工程里没有原始签名文件，用本机自动生成的调试证书签名，保证 APK 能直接安装
            signingConfig signingConfigs.debug
        }
        debug {
            testCoverageEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // 本项目 targetSdk 保持 29（沿用原行为），Gradle 的 lintVital 会因为
        // “targetSdk 过旧”中断 release 构建，这里关掉即可，不影响 APK 生成
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'androidx.activity:activity:1.2.4'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
